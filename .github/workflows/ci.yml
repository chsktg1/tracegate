name: Verify Tracegate
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tracegate
          POSTGRES_PASSWORD: tracegate
          POSTGRES_DB: tracegate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracegate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tracegate:tracegate@localhost:5432/tracegate_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
